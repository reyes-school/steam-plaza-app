# /etc/nginx/sites-available/steamplaza — Steam Plaza behind nginx with flood (DDoS) protection.
# limit_req_zone / limit_conn_zone must be in the http {} context: this file is included there via sites-enabled.
limit_req_zone  $binary_remote_addr zone=sp_api:20m   rate=15r/s;
limit_req_zone  $binary_remote_addr zone=sp_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sp_conn:10m;

server {
  listen 80;
  server_name app.steamplaza.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name app.steamplaza.uz;
  # certbot --nginx fills in ssl_certificate lines here
  server_tokens off;

  client_max_body_size 30m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 15s;
  limit_conn sp_conn 40;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /api/auth/login {
    limit_req zone=sp_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/steamplaza-proxy.conf;
  }
  location /api/ {
    limit_req zone=sp_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/steamplaza-proxy.conf;
  }
  location / {
    limit_req zone=sp_api burst=100 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/steamplaza-proxy.conf;
  }
}
